name: Hardware or protocol research
description: Propose a measured feasibility investigation
title: "research: "
labels: [research]
body:
  - type: dropdown
    id: truth
    attributes:
      label: Current truth label
      options: [Unproven, Experimental, Likely viable, Proven]
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: Exact question
      description: State what result would prove or disprove the claim.
    validations:
      required: true
  - type: textarea
    id: matrix
    attributes:
      label: Hardware and software matrix
    validations:
      required: true
  - type: textarea
    id: method
    attributes:
      label: Reproducible method and metrics
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: Primary sources, revisions, and licenses
    validations:
      required: true
