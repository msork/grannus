# Automatically consumed by `cargo fuzz`; kept outside the production workspace.
[package]
name = "grannus-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
grannus-protocol = { path = "../crates/grannus-protocol" }
libfuzzer-sys = "0.4.13"

[[bin]]
name = "decode-input-v1"
path = "fuzz_targets/decode_input_v1.rs"
test = false
doc = false
bench = false

[workspace]
members = []
