# Validated host configuration. All network-exposure and pairing features remain disabled in M0.

[host]
name = "grannus"
listen = "127.0.0.1:47990"
internet_exposure = false

[video]
width = 1920
height = 1080
refresh_hz = 60
codec = "h264"
bitrate_kbps = 20000
low_latency = true
b_frames = 0
lookahead_frames = 0

[audio]
sample_rate_hz = 48000
channels = 2

[input]
stale_after_ms = 100
neutralize_after_ms = 250
max_player_slots = 8

[discovery]
lan = false
upnp = false
pcp = false
nat_pmp = false

[security]
pairing_enabled = false
allow_unpaired = false
